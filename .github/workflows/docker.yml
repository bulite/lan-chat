name: Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and smoke test
        run: |
          docker build --tag lan-chat:ci .
          container=$(docker run -d --tmpfs /data:uid=1000,gid=1000,mode=0700 lan-chat:ci)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          docker exec -i "$container" node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const origin = 'http://127.0.0.1:8910';
          for (let attempt = 0; attempt < 20; attempt++) {
            if (await fetch(origin + '/health').then(response => response.ok, () => false)) break;
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          assert((await fetch(origin + '/health')).ok);
          const icon = await fetch(origin + '/icon.png');
          assert(icon.ok);
          assert.equal(icon.headers.get('content-type'), 'image/png');
          JS
      - name: Publish to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9_-]+$ || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Set the DOCKERHUB_USERNAME Actions variable and DOCKERHUB_TOKEN Actions secret.'
            exit 1
          fi
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          image="$DOCKERHUB_USERNAME/lan-chat"
          tag="sha-${GITHUB_SHA:0:12}"
          docker tag lan-chat:ci "$image:$tag"
          docker tag lan-chat:ci "$image:latest"
          docker push "$image:$tag"
          docker push "$image:latest"
