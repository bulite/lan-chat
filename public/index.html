<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>邻聊</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css?v=workspace-27">
</head>
<body>
  <section id="login">
    <div class="login-card">
      <img class="brand" src="/icon.svg" alt="">
      <h1>邻聊</h1>
      <p>正在进入聊天室…</p>
      <p id="loginError" role="alert"></p>
    </div>
  </section>
  <main id="workspace" hidden>
    <aside id="roomSidebar" class="sidebar" aria-labelledby="roomsTitle">
      <div class="workspace-brand"><img class="brand" src="/icon.svg" alt=""><strong>邻聊</strong></div>
      <header>
        <h2 id="roomsTitle">频道</h2>
        <button id="addRoom" type="button" title="新建群聊" aria-label="新建群聊">＋</button>
      </header>
      <div class="search"><input id="search" type="search" aria-label="搜索频道" placeholder="搜索频道"></div>
      <div id="rooms"></div>
      <footer>
        <span id="myName"></span>
        <div class="account-actions">
          <label class="theme-setting">主题
            <select id="themeMode"><option value="system">跟随系统</option><option value="light">日间</option><option value="dark">夜间</option></select>
          </label>
          <button id="manageAuditors" type="button" hidden>审查管理</button>
          <button id="editName" type="button">修改用户名</button>
        </div>
      </footer>
    </aside>

    <section class="conversation" aria-labelledby="roomTitle">
      <header class="chat-header">
        <button id="backToRooms" type="button" aria-label="返回群聊列表">‹</button>
        <div class="chat-title">
          <h2 id="roomTitle">群聊</h2>
          <small><i aria-hidden="true"></i><span id="connection" role="status">正在连接</span></small>
        </div>
        <button id="toggleChatMenu" type="button" aria-label="更多群聊操作" aria-controls="chatHeaderActions" aria-expanded="false">⋯</button>
        <div class="chat-header-actions" id="chatHeaderActions">
          <button id="toggleRoomSidebar" type="button" aria-controls="roomSidebar" aria-expanded="true">折叠群聊</button>
          <button id="toggleMessageSearch" type="button" aria-controls="messageSearch" aria-expanded="false">搜索</button>
          <button id="toggleMembers" type="button" aria-controls="memberPanel" aria-expanded="false">展开协作</button>
        </div>
      </header>
      <div id="activeRoleReplies" class="active-role-replies" role="status" tabindex="0" aria-label="正在回复的角色" hidden></div>
      <div id="messageSearch" class="message-search" hidden>
        <input id="messageQuery" type="search" placeholder="搜索当前群聊消息" aria-label="搜索当前群聊消息">
        <span id="messageSearchCount" role="status"></span>
        <button id="previousMatch" type="button" aria-label="上一个结果">↑</button>
        <button id="nextMatch" type="button" aria-label="下一个结果">↓</button>
      </div>
      <div class="message-viewport">
        <div id="messages" aria-live="polite"></div>
        <button id="jumpLatest" type="button" aria-label="回到最新消息" hidden>↓</button>
      </div>
      <div id="filePreview" hidden></div>
      <section class="composer" aria-label="发送消息">
        <div class="toolbar" id="composerOptions">
          <button id="pickFile" class="composer-icon-button" type="button" title="上传图片或文件，最大 25 MB" aria-label="上传图片或文件"><span class="composer-icon image-icon" aria-hidden="true"></span></button>
          <label class="composer-icon-button document-switch" title="按文档发送"><input id="asDocument" type="checkbox" aria-label="按文档发送"><span class="composer-icon document-icon" aria-hidden="true"></span></label>
          <button id="previewMarkdownDraft" type="button">预览 Markdown</button>
          <button id="clearMobileDraft" type="button">清空草稿</button>
          <input id="file" type="file" hidden>
        </div>
        <div class="compose-entry">
          <button id="toggleComposerOptions" type="button" aria-controls="composerOptions" aria-expanded="false" aria-label="发送选项">＋</button>
          <textarea id="draft" aria-label="消息正文" placeholder="发送消息…"></textarea>
          <div class="compose-actions">
            <button id="pickSticker" type="button" aria-label="发表情" title="发表情"><span aria-hidden="true">☺</span></button>

            <button id="clearDraft" type="button">清空</button>
            <button id="send" type="button" aria-label="发送"><span class="send-text">发送</span><span class="send-arrow" aria-hidden="true">↑</span></button>
          </div>
        </div>
        <span id="notice" role="status"></span>
      </section>
    </section>

    <aside id="memberPanel" aria-labelledby="memberPanelTitle" hidden>
      <header class="member-panel-header">
        <div><h2 id="memberPanelTitle">Agent 协作</h2><p id="memberPanelRoom"></p></div>
        <button id="closeMembers" type="button" aria-label="折叠协作侧栏">×</button>
      </header>
      <section class="member-section" aria-labelledby="roomRolesTitle">
        <h3 id="roomRolesTitle">本群 Agent <span id="roomRoleCount" class="member-count"></span></h3>
        <div id="roomRoles" class="member-list"></div>
        <details class="role-settings">
          <summary>添加或设置 Agent</summary>
          <label>角色 <select id="roomRoleSelect"></select></label>
          <label>推理强度 <select id="roomEffort"></select></label>
          <button id="addRoomRole" type="button">保存设置</button>
        </details>
      </section>
      <section class="member-section" aria-labelledby="roomTasksTitle">
        <h3 id="roomTasksTitle">近期任务</h3>
        <div id="roomTasks" class="task-summary" role="status"></div>
      </section>
      <section id="roomAuditor" class="member-section room-auditor" hidden>
        <h3>统一审查员</h3>
        <label>本群使用 <select id="roomAuditorProfile"><option value="">不使用统一审查员</option></select></label>
        <button id="saveRoomAuditor" type="button">应用到本群</button>
        <p id="roomAuditorStatus" role="status"></p>
      </section>
      <section class="member-section"><button id="removeRoom" type="button" hidden>删除当前群聊</button></section>
      <section class="member-section" aria-labelledby="spaceMembersTitle">
        <h3 id="spaceMembersTitle">邻聊用户与 Agent <span id="memberCount" class="member-count"></span></h3>
        <p>整个邻聊实例的账号，可用于定向通知。群里的角色见「本群 Agent」。</p>
        <div id="members" class="member-list"></div>
      </section>
    </aside>
  </main>
  <dialog id="roleDetailsDialog" class="avatar-dialog role-details-dialog" aria-labelledby="roleDetailsName">
    <form method="dialog">
      <header><h3 id="roleDetailsName"></h3><button type="submit">关闭</button></header>
      <dl id="roleDetailsFields"></dl>
      <p id="roleDetailsStatus" role="status"></p>
    </form>
  </dialog>
  <dialog id="roomDialog">
    <form method="dialog">
      <h3>新建群聊</h3>
      <input id="newRoomName" aria-label="群聊名称" placeholder="群聊名称" maxlength="60" required>
      <div><button value="cancel" formnovalidate>取消</button><button id="confirmRoom" value="create">创建</button></div>
    </form>
  </dialog>
  <dialog id="auditorDialog" class="room-auditor">
    <header><h3>审查管理</h3><button id="closeAuditors" type="button">关闭</button></header>
    <details open><summary>公共审查员配置</summary>
      <label>选择配置 <select id="profilePicker"><option value="">新建配置</option></select></label>
        <form id="auditorForm" autocomplete="off">
          <fieldset id="auditorFields">
            <label>配置名称 <input id="profileName" maxlength="80" required></label>
            <label>OpenAI 兼容接口
              <input id="auditorUrl" type="url" spellcheck="false" maxlength="2048" required placeholder="https://api.example.com/v1">
            </label>
            <p>可填写 API 基础地址或完整的 Chat Completions 地址。</p>
            <label>回复判断模型
              <select id="auditorModel" required><option value="">请先拉取模型</option></select>
            </label>
            <label>转发倾向
              <select id="auditorRoutingBias">
                <option value="forward">倾向转发</option>
                <option value="balanced" selected>平衡</option>
                <option value="hold">倾向不转发</option>
              </select>
            </label>
            <p>影响拿不准时是否转发，审查员可选择一位或多位相关角色。明确 @ 角色时直接派发。</p>
            <details><summary>高级设置</summary><label>上下文上限（估算 token）
              <input id="auditorContextLimit" type="number" min="2048" max="131072" step="1" value="8192" required>
            </label><p>默认 8192，接近上限时会自动压缩较早的消息。</p></details>
            <label>API 密钥
              <input id="auditorApiKey" type="password" autocomplete="new-password" maxlength="4096" aria-describedby="auditorApiKeyHint">
            </label>
            <p id="auditorApiKeyHint"></p>
            <button id="loadAuditorModels" type="button">拉取模型</button>
            <button id="saveAuditor" type="submit">保存审查员设置</button>
          </fieldset>
        </form>
      <p id="auditorStatus" role="status"></p>
    </details>
    <details open><summary>最近审查记录</summary>
      <label>群聊 <select id="auditHistoryRoom"><option value="">所有群聊</option></select></label>
      <button id="refreshAuditHistory" type="button">刷新记录</button>
      <p id="auditHistoryStatus" role="status"></p>
      <div id="auditHistory"></div>
    </details>
  </dialog>
  <dialog id="removeRoomDialog">
    <form id="removeRoomForm" autocomplete="off">
      <h3>删除群聊</h3>
      <p id="removeRoomWarning"></p>
      <label>输入群名称 <input id="removeRoomName" required></label>
      <p id="removeRoomStatus" role="status"></p>
      <div><button id="cancelRemoveRoom" type="button">取消</button><button id="confirmRemoveRoom" type="submit">永久删除</button></div>
    </form>
  </dialog>
  <dialog id="nameDialog">
    <form method="dialog">
      <h3>修改用户名</h3>
      <input id="newUserName" aria-label="用户名" maxlength="50" required>
      <div><button value="cancel" formnovalidate>取消</button><button value="save">保存</button></div>
    </form>
  </dialog>
  <script src="/markdown-it.min.js"></script>
  <script src="/app.js?v=workspace-27" type="module"></script>
</body>
</html>
